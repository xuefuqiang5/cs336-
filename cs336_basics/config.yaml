# ===================== tokenizer =====================
data_path: "/home/xuewenqi/cs336-/data/TinyStoriesV2-GPT4-train.txt"
vocab_filepath: "/home/xuewenqi/cs336-/cs336_basics/Tokenizer/vocab.json"
merges_filepath: "/home/xuewenqi/cs336-/cs336_basics/Tokenizer/merges.txt"
buffer_size: 4194304

# ===================== model =====================
# 根据 GPT-2 Small 配置
vocab_size: 10000
context_length: 1024
num_layers: 12
d_model: 768
num_heads: 12
d_ff: 3072
theta: 10000.0

# ===================== optimizer =====================
lr: 0.0003  # 3e-4
betas: [0.9, 0.95]
eps: 1e-8
weight_decay: 0.1

# ===================== train =====================
batch_size: 16
epochs: 10
grad_clip: 1.0
dtype: "float32"
log_interval: 100
save_interval: 1000  # 每 1000 步保存一次
checkpoint_dir: "./checkpoints"